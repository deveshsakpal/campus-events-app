server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/campus_events}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:campus-events-jwt-secret-key-must-be-at-least-32-chars!}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5000,https://*.onrender.com}